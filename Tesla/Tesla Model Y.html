<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* Slider styles */
        .slider {
            width: 100%;
            height: 100vh; /* Set to 100% of the viewport height */
            overflow: hidden;
            margin-bottom: 20px; /* Add space between slider and cards */
            position: relative;
        }

        .slides {
            display: flex;
            transition: 0.5s;
            height: 90%; /* Set the height of the slides to 100% of the slider height */
        }

        .slide {
            width: 100%;
            height: 100%; /* Set to 100% of the slide's container (slider) */
            flex-shrink: 0;
        }

        .slide img {
            width: 100%; /* Set image width to 100% */
            height: 100%; /* Set the image to fill the entire slide */
            object-fit: cover;
        }

        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
            width: auto;
            padding: 16px;
            color: white;
            font-weight: bold;
            font-size: 20px;
            transition: 0.3s;
            user-select: none;
        }

        .prev {
            left: 0;
        }

        .next {
            right: 0;
        }

        .prev:hover, .next:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Slider</title>
</head>
<body>
    <div class="container">
        <div class="slider">
            <div class="slides">
                <div class="slide"><img src="https://media.gq-magazine.co.uk/photos/5ee78f91cae7314f2965c7b2/master/w_1600%2Cc_limit/20200615-tesla-02.jpg" alt="Image 1" onerror="this.onerror=null; this.src='https://via.placeholder.com/600x400?text=Image+1+not+found';"></div>
                <div class="slide"><img src="https://e1.pxfuel.com/desktop-wallpaper/525/465/desktop-wallpaper-tesla-model-y-interior-review-much-more-than-a-model-3-xl-tesla-model-3-inside.jpg" alt="Image 2" onerror="this.onerror=null; this.src='https://via.placeholder.com/600x400?text=Image+2+not+found';"></div>
                <div class="slide"><img src="https://editorial.pxcrush.net/carsales/general/editorial/polestar-2-v-tesla-model-3-040.jpg?width=1024&height=682" alt="Image 3" onerror="this.onerror=null; this.src='https://via.placeholder.com/600x400?text=Image+3+not+found';"></div>
            </div>
            <div class="prev" onclick="plusSlide(-1)">&#10094;</div>
            <div class="next" onclick="plusSlide(1)">&#10095;</div>
        </div>
    </div>
    <script>
        let slideIndex = 1;

        function plusSlide(n) {
            showSlides(slideIndex += n);
        }

        function showSlides(n) {
            let slides = document.getElementsByClassName("slide");
            if (n > slides.length) {
                slideIndex = 1;
            }
            if (n < 1) {
                slideIndex = slides.length;
            }
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            slides[slideIndex - 1].style.display = "block";
        }

        showSlides(slideIndex);
    </script>
</body>
</html>
